<script type="text/javascript">
    RED.nodes.registerType('adiosun-config',{
        category: 'config',
        defaults: {
            name: {value:""},
            broker: {value:"", required:true},
            port: {value:1883, required:true, validate:RED.validators.number()},
            username: {value:""},
            password: {value:""}
        },
        label: function() {
            return this.name || "adiosun config";
        },
        oneditprepare: function() {
            var node = this;
            
            // Dodajemy przycisk do testowania połączenia
            $("#node-config-mqtt-test").click(function() {
                var broker = $("#node-config-input-broker").val();
                var port = $("#node-config-input-port").val();
                var username = $("#node-config-input-username").val();
                var password = $("#node-config-input-password").val();
                
                if (!broker) {
                    RED.notify("Podaj adres brokera!", "error");
                    return;
                }
                
                $("#node-config-mqtt-test").addClass("disabled").html(
                    '<i class="fa fa-spinner fa-spin"></i> Testowanie...'
                );
                
                // Wysyłamy zapytanie do testowania połączenia
                $.getJSON('adiosun/mqtt/test', {
                    broker: broker,
                    port: port,
                    username: username,
                    password: password
                })
                .done(function(data) {
                    if (data.status === "success") {
                        RED.notify(data.message, "success");
                    } else {
                        RED.notify(data.message, "error");
                    }
                })
                .fail(function() {
                    RED.notify("Błąd podczas testowania połączenia", "error");
                })
                .always(function() {
                    $("#node-config-mqtt-test").removeClass("disabled").html(
                        '<i class="fa fa-exchange"></i> Testuj połączenie'
                    );
                });
            });
        }
    });
</script>

<script type="text/html" data-template-name="adiosun-config">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-config-input-name">
    </div>
    <div class="form-row">
        <label for="node-config-input-broker"><i class="fa fa-globe"></i> Broker</label>
        <input type="text" id="node-config-input-broker" placeholder="mqtt://localhost">
    </div>
    <div class="form-row">
        <label for="node-config-input-port"><i class="fa fa-random"></i> Port</label>
        <input type="text" id="node-config-input-port" placeholder="1883">
    </div>
    <div class="form-row">
        <label for="node-config-input-username"><i class="fa fa-user"></i> Username</label>
        <input type="text" id="node-config-input-username">
    </div>
    <div class="form-row">
        <label for="node-config-input-password"><i class="fa fa-lock"></i> Password</label>
        <input type="password" id="node-config-input-password">
    </div>
    <div class="form-row">
        <label>&nbsp;</label>
        <button type="button" id="node-config-mqtt-test" class="red-ui-button">
            <i class="fa fa-exchange"></i> Testuj połączenie
        </button>
    </div>
</script>

<script type="text/html" data-help-name="adiosun-config">
    <p>MQTT configuration for Adiosun node</p>
    <h3>Details</h3>
    <p>Configure the MQTT connection settings:</p>
    <ul>
        <li><b>Broker</b> - the MQTT broker address</li>
        <li><b>Port</b> - the MQTT broker port (default: 1883)</li>
        <li><b>Username/Password</b> - optional credentials for broker authentication</li>
    </ul>
</script>
